name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "bin/**"
      - "tsconfig.build.json"
      - ".github/workflows/publish.yml"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test

  publish:
    needs: [test]
    if: github.repository == 'EvanBacon/inspect-webkit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: inspect-webkit-publish
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Detect changes
        id: changes
        run: |
          # Publish if source changed, this workflow was dispatched, or
          # package.json is already on npm (so a rerun can still tag and
          # open the bump PR). A package.json-only change is the bump PR
          # itself and must not publish a new version.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          SOURCE_CHANGED=false
          if echo "$CHANGED" | grep -qE "^(src/|bin/|tsconfig\.build\.json)"; then
            SOURCE_CHANGED=true
          fi

          LOCAL=$(node -p "require('./package.json').version")
          ON_NPM=false
          if npm view "inspect-webkit@$LOCAL" version >/dev/null 2>&1; then
            ON_NPM=true
          fi

          if [ "$SOURCE_CHANGED" = "true" ] || [ "$ON_NPM" = "true" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup bun
        if: steps.changes.outputs.publish == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        if: steps.changes.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        if: steps.changes.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      - name: Build and publish
        if: steps.changes.outputs.publish == 'true'
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # package.json holds the exact stable version to publish. No hidden
          # bump from max(local, npm). If that version is already on npm, skip
          # publish so a rerun can still tag and open the bump PR.
          PLAN=$(node scripts/publish-version.mjs stable)
          ACTION=${PLAN%% *}
          VERSION=${PLAN#* }
          echo "action=$ACTION version=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$ACTION" = "publish" ]; then
            bun run build
            npm publish --access public
          elif [ "$ACTION" = "skip" ]; then
            echo "inspect-webkit@$VERSION already on npm; skipping publish (idempotent rerun)"
          else
            echo "::error::Unexpected stable plan: $ACTION $VERSION"
            exit 1
          fi

      - name: Tag release and open the next-version bump PR
        if: steps.changes.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.publish.outputs.version }}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version from the publish step."
            exit 1
          fi

          SCRIPT=scripts/publish-version.mjs
          TAG=$(node "$SCRIPT" tag-name "$VERSION")
          HEAD=$(git rev-parse HEAD)
          EXISTING=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
          if [ -n "$EXISTING" ]; then
            git fetch origin tag "$TAG" --no-tags
            EXISTING=$(git rev-list -n 1 "$TAG")
          else
            EXISTING=-
          fi
          DECISION=$(node "$SCRIPT" tag-decision "$EXISTING" "$HEAD")
          if [ "$DECISION" = "create" ]; then
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created $TAG at $HEAD"
          else
            echo "$TAG already points at HEAD; reusing"
          fi

          git fetch origin main
          MAIN_VERSION=$(git show origin/main:package.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>console.log(JSON.parse(s).version))")
          PLAN=$(node "$SCRIPT" plan-bump "$MAIN_VERSION" "$VERSION")
          ACTION=${PLAN%% *}
          NEXT=${PLAN#* }
          if [ "$ACTION" = "skip" ]; then
            echo "origin/main already has $NEXT; no bump PR needed"
            exit 0
          fi

          BRANCH=$(node "$SCRIPT" bump-branch "$NEXT")
          TITLE=$(node "$SCRIPT" bump-title "$NEXT")
          BODY=$(node --input-type=module -e "
            import { bumpPrBody, releaseTagName } from './$SCRIPT';
            process.stdout.write(bumpPrBody({ released: process.argv[1], next: process.argv[2], tag: releaseTagName(process.argv[1]) }));
          " "$VERSION" "$NEXT")

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          REMOTE_OK=false
          if git fetch origin "$BRANCH"; then
            REMOTE_VERSION=$(git show "origin/$BRANCH:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>console.log(JSON.parse(s).version))")
            if [ "$REMOTE_VERSION" = "$NEXT" ]; then
              REMOTE_OK=true
              echo "Branch $BRANCH already bumps to $NEXT"
            fi
          fi

          if [ "$REMOTE_OK" != "true" ]; then
            git checkout -B "$BRANCH" origin/main
            node "$SCRIPT" set "$NEXT"
            git add package.json
            if git diff --cached --quiet; then
              echo "::error::Checked out $BRANCH from origin/main but package.json did not change to $NEXT."
              exit 1
            fi
            git commit -m "chore: bump inspect-webkit to $NEXT [skip ci]"
            git push --force-with-lease origin "$BRANCH"
          fi

          API="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/pulls"
          QUERY=$(node -e "process.stdout.write('head=' + process.argv[1] + ':' + encodeURIComponent(process.argv[2]) + '&state=open')" "$GITHUB_REPOSITORY_OWNER" "$BRANCH")
          EXISTING_PR=$(curl -sS \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}?${QUERY}")
          PR_URL=$(node -e "
            const pulls = JSON.parse(process.argv[1]);
            if (!Array.isArray(pulls)) {
              console.error(typeof pulls === 'object' ? JSON.stringify(pulls) : pulls);
              process.exit(2);
            }
            const hit = pulls.find(p => p.html_url);
            if (hit) process.stdout.write(hit.html_url);
          " "$EXISTING_PR") || {
            echo "::error::Failed to query existing bump PRs for $BRANCH."
            exit 1
          }

          if [ -n "$PR_URL" ]; then
            echo "Reusing bump PR $PR_URL"
            exit 0
          fi

          PAYLOAD=$(node -e "
            process.stdout.write(JSON.stringify({
              title: process.argv[1],
              head: process.argv[2],
              base: 'main',
              body: process.argv[3],
            }));
          " "$TITLE" "$BRANCH" "$BODY")
          CREATE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$API")
          PR_URL=$(node -e "
            const pr = JSON.parse(process.argv[1]);
            if (!pr.html_url) process.exit(2);
            process.stdout.write(pr.html_url);
          " "$CREATE") || {
            echo "$CREATE"
            echo "::error::Failed to open the bump PR for $NEXT. If the API says GitHub Actions is not permitted to create or approve pull requests, enable Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests. Do not add a PAT. The package was published and tagged ${TAG}."
            exit 1
          }
          echo "Opened bump PR $PR_URL"
